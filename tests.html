<body>
<div class="container">
  <h1>Tests · <strong>Anatomía</strong></h1>
  <div class="subtitle">Suite de tests sobre las funciones puras de cálculo</div>

  <button onclick="runAllTests()">Re-ejecutar todo</button>

<script>
// ============================================================
// MINI TEST HARNESS — sin dependencias, vanilla
// ============================================================
// Uso:
//   group('Nombre del grupo', () => {
//     test('descripción', () => {
//       assertEqual(actual, expected, 'opcional mensaje');
//     });
//   });
//
// Al final, runAllTests() ejecuta todo y pinta resultados en el DOM.

const allGroups = [];
let currentGroup = null;

function group(name, fn) {
  currentGroup = { name: name, tests: [] };
  allGroups.push(currentGroup);
  try {
    fn();
  } catch (e) {
    // Si la función de grupo tira (ej: setup), lo registramos como un test fallido
    currentGroup.tests.push({
      name: '⚠ Error fatal en setup del grupo',
      ok: false,
      error: String(e && e.stack || e),
      timeMs: 0
    });
  }
  currentGroup = null;
}

function test(name, fn) {
  if (!currentGroup) throw new Error('test() llamado fuera de group()');
  const t0 = performance.now();
  let ok = true, error = null;
  try {
    fn();
  } catch (e) {
    ok = false;
    error = String(e && e.message || e);
    if (e && e.stack && error.length < 200) error += '\n' + e.stack.split('\n')[1];
  }
  currentGroup.tests.push({
    name: name,
    ok: ok,
    error: error,
    timeMs: Math.round((performance.now() - t0) * 100) / 100
  });
}

function assert(cond, msg) {
  if (!cond) throw new Error('Assert falló: ' + (msg || 'sin mensaje'));
}

function assertEqual(actual, expected, msg) {
  // Comparación profunda con JSON.stringify para objetos/arrays.
  // Para primitivos, ===.
  if (typeof actual === 'object' || typeof expected === 'object') {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a !== e) {
      throw new Error((msg ? msg + ' — ' : '') + 'esperado ' + e + ', obtuve ' + a);
    }
  } else {
    if (actual !== expected) {
      throw new Error((msg ? msg + ' — ' : '') + 'esperado ' + JSON.stringify(expected) + ', obtuve ' + JSON.stringify(actual));
    }
  }
}

function assertAlmost(actual, expected, tolerance, msg) {
  tolerance = tolerance != null ? tolerance : 0.01;
  if (Math.abs(actual - expected) > tolerance) {
    throw new Error((msg ? msg + ' — ' : '') + 'esperado ~' + expected + ' (±' + tolerance + '), obtuve ' + actual);
  }
}

function assertNull(actual, msg) {
  if (actual !== null) {
    throw new Error((msg ? msg + ' — ' : '') + 'esperado null, obtuve ' + JSON.stringify(actual));
  }
}

// Mock global state para tests que dependen de él
function setupState(partial) {
  window.state = Object.assign({
    selYear: 2026,
    selQuarter: null,
    selMonth: null,
    params: {},
    transactionsByYear: {},
    categoryRules: [],
    categoryClassification: {},
    subcategoryClassification: {}
  }, partial || {});
}

// ============================================================
// SUITE — STRINGS
// ============================================================

group('norm — normalización de strings', function () {
  test('lowercase básico', function () {
    assertEqual(norm('HOLA'), 'hola');
  });
  test('quita acentos en castellano', function () {
    assertEqual(norm('ñoño café'), 'nono cafe');
  });
  test('preserva números y símbolos', function () {
    assertEqual(norm('Spotify P*ABL 123'), 'spotify p*abl 123');
  });
  test('vacío y null', function () {
    assertEqual(norm(''), '');
    assertEqual(norm(null), '');
    assertEqual(norm(undefined), '');
  });
  test('idempotente', function () {
    const s = 'Médico María Ñ';
    assertEqual(norm(norm(s)), norm(s));
  });
});

group('escapeHtmlSafe — escape HTML', function () {
  test('escapa caracteres peligrosos', function () {
    assertEqual(escapeHtmlSafe('<script>'), '&lt;script&gt;');
    assertEqual(escapeHtmlSafe('a & b'), 'a &amp; b');
    assertEqual(escapeHtmlSafe('"hola"'), '&quot;hola&quot;');
  });
  test('preserva texto normal', function () {
    assertEqual(escapeHtmlSafe('Hola mundo'), 'Hola mundo');
  });
  test('vacío y null', function () {
    assertEqual(escapeHtmlSafe(''), '');
    assertEqual(escapeHtmlSafe(null), '');
  });
});

group('formatNumberAr — formato es-AR de miles', function () {
  test('entero corto', function () {
    assertEqual(formatNumberAr(0), '0');
    assertEqual(formatNumberAr(50), '50');
    assertEqual(formatNumberAr(999), '999');
  });
  test('miles con punto', function () {
    assertEqual(formatNumberAr(1000), '1.000');
    assertEqual(formatNumberAr(50000), '50.000');
    assertEqual(formatNumberAr(1234567), '1.234.567');
  });
  test('millones', function () {
    assertEqual(formatNumberAr(1000000), '1.000.000');
    assertEqual(formatNumberAr(12345678), '12.345.678');
  });
  test('negativos', function () {
    // Intl puede usar guión normal o Unicode '−' (U+2212) según locale.
    // Aceptamos ambas variantes en la comparación.
    const out = formatNumberAr(-1234567);
    assert(out === '-1.234.567' || out === '−1.234.567');
  });
  test('decimales detectados automáticamente', function () {
    assertEqual(formatNumberAr(1234.5), '1.234,5');
    assertEqual(formatNumberAr(1234.56), '1.234,56');
  });
  test('decimales forzados con segundo argumento', function () {
    assertEqual(formatNumberAr(1234, 2), '1.234,00');
    assertEqual(formatNumberAr(1234.5, 0), '1.235');
  });
  test('null/undefined/NaN devuelven vacío', function () {
    assertEqual(formatNumberAr(null), '');
    assertEqual(formatNumberAr(undefined), '');
    assertEqual(formatNumberAr(NaN), '');
    assertEqual(formatNumberAr(''), '');
  });
  test('strings numéricos también funcionan', function () {
    assertEqual(formatNumberAr('1234567'), '1.234.567');
    assertEqual(formatNumberAr('1234.56'), '1.234,56');
  });
});

group('parseNumberAr — parser tolerante', function () {
  test('formato es-AR con puntos como miles', function () {
    assertEqual(parseNumberAr('1.234.567'), 1234567);
    assertEqual(parseNumberAr('50.000'), 50000);
    assertEqual(parseNumberAr('1.000'), 1000);
  });
  test('formato es-AR con decimales (coma)', function () {
    assertEqual(parseNumberAr('1.234.567,89'), 1234567.89);
    assertEqual(parseNumberAr('1.234,5'), 1234.5);
  });
  test('sin separadores', function () {
    assertEqual(parseNumberAr('1234567'), 1234567);
    assertEqual(parseNumberAr('50'), 50);
    assertEqual(parseNumberAr('0'), 0);
  });
  test('formato US con comas como miles', function () {
    assertEqual(parseNumberAr('1,234,567'), 1234567);
  });
  test('formato US con punto decimal', function () {
    assertEqual(parseNumberAr('1234.56'), 1234.56);
    assertEqual(parseNumberAr('0.5'), 0.5);
  });
  test('1 punto con 3 dígitos = miles es-AR', function () {
    assertEqual(parseNumberAr('1.234'), 1234);
  });
  test('1 punto con 1 o 2 dígitos = decimal', function () {
    assertEqual(parseNumberAr('1.5'), 1.5);
    assertEqual(parseNumberAr('1.50'), 1.5);
  });
  test('negativos', function () {
    assertEqual(parseNumberAr('-1.234.567'), -1234567);
    assertEqual(parseNumberAr('-1.234,5'), -1234.5);
    assertEqual(parseNumberAr('-50'), -50);
  });
  test('espacios y trim', function () {
    assertEqual(parseNumberAr('  1.234  '), 1234);
    assertEqual(parseNumberAr(' -50,5 '), -50.5);
  });
  test('vacío → 0, null → null', function () {
    assertEqual(parseNumberAr(''), 0);
    assertEqual(parseNumberAr('   '), 0);
    assertEqual(parseNumberAr(null), null);
    assertEqual(parseNumberAr(undefined), null);
  });
  test('string inválido → 0', function () {
    assertEqual(parseNumberAr('abc'), 0);
    assertEqual(parseNumberAr('hola1234'), 0);
  });
  test('redondea correctamente al roundtrip', function () {
    // format → parse debe dar el mismo número (entero o decimal)
    assertEqual(parseNumberAr(formatNumberAr(1234567)), 1234567);
    assertEqual(parseNumberAr(formatNumberAr(50000)), 50000);
    assertEqual(parseNumberAr(formatNumberAr(1234.56)), 1234.56);
  });
});

// SUITE — FECHAS
// ============================================================

group('ddMmToIso — parser de fechas', function () {
  test('formato ISO ya válido', function () {
    assertEqual(ddMmToIso('2026-03-14'), '2026-03-14');
  });
  test('ISO con un solo dígito normaliza padding', function () {
    assertEqual(ddMmToIso('2026-3-4'), '2026-03-04');
  });
  test('dd/mm/yyyy', function () {
    assertEqual(ddMmToIso('14/03/2026'), '2026-03-14');
  });
  test('dd-mm-yyyy con guiones', function () {
    assertEqual(ddMmToIso('14-03-2026'), '2026-03-14');
  });
  test('dd/mm/yy asume siglo XXI', function () {
    assertEqual(ddMmToIso('14/03/26'), '2026-03-14');
  });
  test('un dígito día/mes con padding', function () {
    assertEqual(ddMmToIso('1/3/2026'), '2026-03-01');
  });
  test('vacío y null', function () {
    assertEqual(ddMmToIso(''), '');
    assertEqual(ddMmToIso(null), '');
    assertEqual(ddMmToIso(undefined), '');
  });
  test('formato no reconocido devuelve vacío', function () {
    assertEqual(ddMmToIso('marzo 14'), '');
    assertEqual(ddMmToIso('2026/03/14'), '');  // este NO está soportado (separador / con yyyy primero)
  });
  test('trim de espacios', function () {
    assertEqual(ddMmToIso(' 14/03/2026 '), '2026-03-14');
  });
});

group('isLeapYear — años bisiestos', function () {
  test('2024 es bisiesto (divisible por 4)', function () {
    assertEqual(isLeapYear(2024), true);
  });
  test('2025 no es bisiesto', function () {
    assertEqual(isLeapYear(2025), false);
  });
  test('2026 no es bisiesto', function () {
    assertEqual(isLeapYear(2026), false);
  });
  test('2000 es bisiesto (divisible por 400)', function () {
    assertEqual(isLeapYear(2000), true);
  });
  test('1900 NO es bisiesto (regla del 100 sin 400)', function () {
    assertEqual(isLeapYear(1900), false);
  });
  test('2100 NO es bisiesto', function () {
    assertEqual(isLeapYear(2100), false);
  });
});

group('daysBetweenISO — diferencia en días', function () {
  test('mismo día = 0', function () {
    assertEqual(daysBetweenISO('2026-03-14', '2026-03-14'), 0);
  });
  test('un día después', function () {
    assertEqual(daysBetweenISO('2026-03-14', '2026-03-15'), 1);
  });
  test('negativo si b < a', function () {
    assertEqual(daysBetweenISO('2026-03-15', '2026-03-14'), -1);
  });
  test('a través de meses', function () {
    assertEqual(daysBetweenISO('2026-02-28', '2026-03-01'), 1);
  });
  test('a través de años (2024 bisiesto)', function () {
    assertEqual(daysBetweenISO('2024-01-01', '2025-01-01'), 366);
  });
  test('null si alguna fecha es inválida', function () {
    assertEqual(daysBetweenISO('', '2026-03-14'), null);
    assertEqual(daysBetweenISO('2026-03-14', ''), null);
    assertEqual(daysBetweenISO('xxx', '2026-03-14'), null);
    assertEqual(daysBetweenISO(null, null), null);
  });
});

group('isNonExpenseCat — cats de sistema', function () {
  test('Sueldo es no-gasto', function () {
    assertEqual(isNonExpenseCat('Sueldo'), true);
  });
  test('Inversion es no-gasto', function () {
    assertEqual(isNonExpenseCat('Inversion'), true);
  });
  test('Trading es no-gasto', function () {
    assertEqual(isNonExpenseCat('Trading'), true);
  });
  test('Reserva es no-gasto', function () {
    assertEqual(isNonExpenseCat('Reserva'), true);
  });
  test('Jubilacion es no-gasto', function () {
    assertEqual(isNonExpenseCat('Jubilacion'), true);
  });
  test('Prestamo (flujo) es no-gasto', function () {
    // Prestamo en flujo = toma de préstamo personal (ingreso). NO confundir con
    // la subcategoría "Prestamo" dentro de "Deuda" que sí es gasto.
    assertEqual(isNonExpenseCat('Prestamo'), true);
  });
  test('__sin__ sentinela también', function () {
    assertEqual(isNonExpenseCat('__sin__'), true);
  });
  test('Alimentacion sí es gasto', function () {
    assertEqual(isNonExpenseCat('Alimentacion'), false);
  });
  test('Entretenimiento sí es gasto', function () {
    assertEqual(isNonExpenseCat('Entretenimiento'), false);
  });
  test('categoría desconocida sí es gasto', function () {
    assertEqual(isNonExpenseCat('Desconocida'), false);
  });
});

group('getCategoryClassification — clasificación basic/discretionary', function () {
  test('cats de sistema → reserved', function () {
    setupState();
    assertEqual(getCategoryClassification('Sueldo'), 'reserved');
    assertEqual(getCategoryClassification('Inversion'), 'reserved');
    assertEqual(getCategoryClassification('Prestamo'), 'reserved');
  });
  test('Vivienda → basic por default', function () {
    setupState();
    assertEqual(getCategoryClassification('Vivienda'), 'basic');
  });
  test('Alimentacion → basic por default', function () {
    setupState();
    assertEqual(getCategoryClassification('Alimentacion'), 'basic');
  });
  test('Entretenimiento → discretionary por default', function () {
    setupState();
    assertEqual(getCategoryClassification('Entretenimiento'), 'discretionary');
  });
  test('override del usuario tiene prioridad', function () {
    setupState({ categoryClassification: { Entretenimiento: 'basic' } });
    assertEqual(getCategoryClassification('Entretenimiento'), 'basic');
  });
  test('categoría desconocida cae a discretionary', function () {
    setupState();
    assertEqual(getCategoryClassification('CategoriaInventada'), 'discretionary');
  });
  test('override no aplica a cats de sistema', function () {
    setupState({ categoryClassification: { Sueldo: 'basic' } });
    assertEqual(getCategoryClassification('Sueldo'), 'reserved');
  });
});

// SUITE — REGLAS
// ============================================================

group('matchCategoryRule — match individual', function () {
  test('contains (default) matchea substring', function () {
    const r = { pattern: 'spotify', categoria: 'Membresias' };
    const res = matchCategoryRule('Spotify P*ABL 5/10', r);
    assertEqual(res.categoria, 'Membresias');
  });
  test('contains insensitive a acentos', function () {
    const r = { pattern: 'cafe', categoria: 'Gastronomia' };
    const res = matchCategoryRule('Café Martínez SA', r);
    assert(res !== null);
    assertEqual(res.categoria, 'Gastronomia');
  });
  test('exact requiere match total normalizado', function () {
    const r = { pattern: 'EXACTO', matchType: 'exact', categoria: 'X' };
    assert(matchCategoryRule('exacto', r) !== null);
    assert(matchCategoryRule('exacto y mas', r) === null);
  });
  test('starts requiere prefijo', function () {
    const r = { pattern: 'mercadopago', matchType: 'starts', categoria: 'Financieras' };
    assert(matchCategoryRule('mercadopago tx 123', r) !== null);
    assert(matchCategoryRule('pago mercadopago', r) === null);
  });
  test('regex case-insensitive', function () {
    const r = { pattern: '^SUPER\\s+', matchType: 'regex', categoria: 'Alimentacion' };
    assert(matchCategoryRule('SUPER COTO 123', r) !== null);
    assert(matchCategoryRule('Super Disco', r) !== null);
    assert(matchCategoryRule('compra super', r) === null);
  });
  test('regex inválido devuelve null sin tirar', function () {
    const r = { pattern: '[invalid', matchType: 'regex', categoria: 'X' };
    assertNull(matchCategoryRule('cualquier cosa', r));
  });
  test('regla deshabilitada devuelve null', function () {
    const r = { pattern: 'algo', categoria: 'X', enabled: false };
    assertNull(matchCategoryRule('algo cualquiera', r));
  });
  test('regla sin pattern devuelve null', function () {
    assertNull(matchCategoryRule('algo', { categoria: 'X' }));
  });
  test('regla sin categoría devuelve null', function () {
    assertNull(matchCategoryRule('algo', { pattern: 'algo' }));
  });
  test('devuelve subcategoria y periodicidad si están', function () {
    const r = { pattern: 'spotify', categoria: 'Membresias', subcategoria: 'Streaming', periodicidad: 'fijo' };
    const res = matchCategoryRule('Spotify XYZ', r);
    assertEqual(res, { categoria: 'Membresias', subcategoria: 'Streaming', periodicidad: 'fijo', tags: [] });
  });
  test('devuelve tags si la regla tiene (array)', function () {
    const r = { pattern: 'bariloche', categoria: 'Gastronomia', tags: ['Viaje2026', 'CLM'] };
    const res = matchCategoryRule('Pago Bariloche restaurante', r);
    assertEqual(res.tags, ['Viaje2026', 'CLM']);
  });
  test('devuelve tags vacío si la regla no tiene', function () {
    const r = { pattern: 'test', categoria: 'X' };
    const res = matchCategoryRule('test 123', r);
    assertEqual(res.tags, []);
  });
  test('migra el formato viejo `tag` (string) a array', function () {
    const r = { pattern: 'test', categoria: 'X', tag: 'JALM' };  // formato pre-multi
    const res = matchCategoryRule('test', r);
    assertEqual(res.tags, ['JALM']);
  });
  test('si tags es array vacío, devuelve array vacío', function () {
    const r = { pattern: 'test', categoria: 'X', tags: [] };
    const res = matchCategoryRule('test', r);
    assertEqual(res.tags, []);
  });
});

group('applyCategoryRules — primera regla que matchea', function () {
  test('aplica la primera regla ordenada', function () {
    setupState({
      categoryRules: [
        { pattern: 'super coto', categoria: 'Alimentacion', subcategoria: 'Super', enabled: true },
        { pattern: 'super', categoria: 'Otra', enabled: true }
      ]
    });
    const res = applyCategoryRules('SUPER COTO 123');
    assertEqual(res.categoria, 'Alimentacion');
    assertEqual(res.subcategoria, 'Super');
  });
  test('null si ninguna regla matchea', function () {
    setupState({
      categoryRules: [{ pattern: 'inexistente', categoria: 'X', enabled: true }]
    });
    assertNull(applyCategoryRules('Compra cualquiera'));
  });
  test('null si no hay reglas', function () {
    setupState({ categoryRules: [] });
    assertNull(applyCategoryRules('Cualquier descripción'));
  });
  test('reglas deshabilitadas se saltean', function () {
    setupState({
      categoryRules: [
        { pattern: 'spotify', categoria: 'X', enabled: false },
        { pattern: 'spotify', categoria: 'Membresias', enabled: true }
      ]
    });
    const res = applyCategoryRules('Spotify Premium');
    assertEqual(res.categoria, 'Membresias');
  });
});

group('forecastNextValue — proyección', function () {
  test('serie vacía → 0', function () {
    assertEqual(forecastNextValue([]), 0);
    assertEqual(forecastNextValue(null), 0);
    assertEqual(forecastNextValue(undefined), 0);
  });
  test('un solo valor → ese valor', function () {
    assertEqual(forecastNextValue([100]), 100);
  });
  test('tendencia ascendente proyecta hacia arriba', function () {
    // [100, 200] → avg=150, last+trend*0.5 = 200+50 = 250
    // mezcla 0.7*150 + 0.3*250 = 105 + 75 = 180
    assertEqual(forecastNextValue([100, 200]), 180);
  });
  test('tendencia descendente proyecta hacia abajo', function () {
    // [200, 100] → avg=150, last+trend*0.5 = 100-50 = 50
    // 0.7*150 + 0.3*50 = 105 + 15 = 120
    assertEqual(forecastNextValue([200, 100]), 120);
  });
  test('serie plana → mismo valor', function () {
    // [100, 100, 100] → avg=100, last+trend*0.5 = 100+0 = 100
    // 0.7*100 + 0.3*100 = 100
    assertEqual(forecastNextValue([100, 100, 100]), 100);
  });
  test('no permite valores negativos (clamp en 0)', function () {
    // [1000, 100] → trend = -900, last+trend*0.5 = 100-450 = -350
    // avg = 550, 0.7*550 + 0.3*(-350) = 385 - 105 = 280 (positivo, OK)
    // Probemos uno que SÍ daría negativo:
    // [10000, 100] → trend=-9900, last+trend*0.5=100-4950=-4850
    // avg=5050, 0.7*5050 + 0.3*(-4850) = 3535 - 1455 = 2080 (todavía positivo)
    // [1000000, 1] → trend=-999999, last+trend*0.5=1-499999.5
    // avg=500000.5, 0.7*500000.5 + 0.3*(-499998.5) = 350000.35 - 149999.55 = 200000.8 ~ 200001
    // Cuesta forzar negativo con la fórmula actual; verifico el clamp con valores ya negativos
    assert(forecastNextValue([0, 0]) >= 0);
    assert(forecastNextValue([1, 0]) >= 0);
  });
  test('redondea a entero', function () {
    const out = forecastNextValue([100, 105, 110]);
    assertEqual(out, Math.round(out));
  });
  test('toma últimos 3 para la media móvil (ignora viejos)', function () {
    // [1000, 1000, 1000, 1000, 1000] → avg=1000, trend=0, esperado 1000
    // si tomara TODOS los 5, sería 1000 igual
    // Hacemos uno donde sí importe:
    // [10000, 10000, 1, 1, 1] → últimos 3: avg=1
    // last=1, prev=1, trend=0, 0.7*1 + 0.3*1 = 1
    assertEqual(forecastNextValue([10000, 10000, 1, 1, 1]), 1);
  });
});

group('buildHeatmapLevels — percentiles del heatmap', function () {

  });

    const data = {
      '2026-01-01': { total: 0 },
      '2026-01-02': { total: 100 },
      '2026-01-03': { total: 200 }
    };
    const levels = buildHeatmapLevels(data);
    assertEqual(levels.days, 2);  // solo cuenta los que tienen >0
  });
  test('un solo día → es todos los percentiles', function () {
    const data = { '2026-01-01': { total: 500 } };
    const levels = buildHeatmapLevels(data);
    assertEqual(levels.levelFor(500), 4);  // máximo, top 5%
    assertEqual(levels.days, 1);
    assertEqual(levels.avg, 500);
  });
  test('clasificación correcta en distribución pareja', function () {
    // 100 días con valores 1..100. P25=25, P50=50, P75=75, P95=95
    const data = {};
    for (let i = 1; i <= 100; i++) {
      data['2026-01-' + i] = { total: i };
    }
    const levels = buildHeatmapLevels(data);
    assertEqual(levels.levelFor(10), 0);   // ≤25
    assertEqual(levels.levelFor(25), 0);   // borde P25
    assertEqual(levels.levelFor(40), 1);   // ≤50
    assertEqual(levels.levelFor(60), 2);   // ≤75
    assertEqual(levels.levelFor(80), 3);   // <P95=95
    assertEqual(levels.levelFor(99), 4);   // ≥95
    assertEqual(levels.days, 100);
  });
  test('monto negativo o 0 → nivel -1', function () {
    const data = { '2026-01-01': { total: 1000 } };
    const levels = buildHeatmapLevels(data);
    assertEqual(levels.levelFor(0), -1);
    assertEqual(levels.levelFor(-100), -1);
  });
  test('top5Threshold matches P95', function () {
    const data = {};
    for (let i = 1; i <= 100; i++) data['d' + i] = { total: i };
    const levels = buildHeatmapLevels(data);
    assertEqual(levels.p95, levels.top5Threshold);
    assertEqual(levels.p95, 95);  // floor((100-1)*0.95)=94 → totals[94]=95
  });
});

      ]
    };

      categoryLabels: { X: 'X' },

        }

      }

    r.issues.forEach(function (i) {

      assert(['warning','error'].indexOf(i.severity) >= 0, 'issue debe tener severity válida');
    });
  });
});

group('Dedup de transacciones importadas', function () {
  test('normalizeTxDescForDedup: lower-case, sin acentos, espacios colapsados', function () {
    assertEqual(normalizeTxDescForDedup('  Café  con  Leche  '), 'cafe con leche');
    assertEqual(normalizeTxDescForDedup('MERCADO PAGO'), 'mercado pago');
    assertEqual(normalizeTxDescForDedup('Pago Tarjeta\tCrédito'), 'pago tarjeta credito');
    assertEqual(normalizeTxDescForDedup(''), '');
    assertEqual(normalizeTxDescForDedup(null), '');
  });

  test('buildTxDedupKey: combina fecha, desc, monto, origen', function () {
    const tx = { fecha: '15/04/2026', descripcion: 'Starbucks', monto: 5000, origen: 'Mercado Pago' };
    const k = buildTxDedupKey(tx);
    assert(k.indexOf('15/04/2026') >= 0);
    assert(k.indexOf('starbucks') >= 0);
    assert(k.indexOf('5000.00') >= 0);
    assert(k.indexOf('mercado pago') >= 0);
  });

  test('buildTxDedupKey: dos tx con la misma info producen la misma clave', function () {
    const t1 = { fecha: '15/04/2026', descripcion: 'Starbucks', monto: 5000, origen: 'Mercado Pago' };
    const t2 = { fecha: '15/04/2026', descripcion: ' STARBUCKS ', monto: 5000.00, origen: 'mercado pago' };
    assertEqual(buildTxDedupKey(t1), buildTxDedupKey(t2));
  });

  test('buildTxDedupKey: tx con monto distinto produce clave distinta', function () {
    const t1 = { fecha: '15/04/2026', descripcion: 'X', monto: 100, origen: 'MP' };
    const t2 = { fecha: '15/04/2026', descripcion: 'X', monto: 200, origen: 'MP' };
    assert(buildTxDedupKey(t1) !== buildTxDedupKey(t2));
  });

  test('dedupIncomingTransactions: sin existentes, todas se agregan', function () {
    const incoming = [
      { fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' },
      { fecha: '02/04/2026', descripcion: 'B', monto: 200, origen: 'MP' }
    ];
    const r = dedupIncomingTransactions(incoming, []);
    assertEqual(r.keptCount, 2);
    assertEqual(r.skippedCount, 0);
  });

  test('dedupIncomingTransactions: todas duplicadas, ninguna se agrega', function () {
    const tx = { fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' };
    const existing = [tx];
    const r = dedupIncomingTransactions([tx], existing);
    assertEqual(r.keptCount, 0);
    assertEqual(r.skippedCount, 1);
  });

  test('dedupIncomingTransactions: parcial — algunas existen, otras no', function () {
    const existing = [
      { fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' }
    ];
    const incoming = [
      { fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' },  // dup
      { fecha: '02/04/2026', descripcion: 'B', monto: 200, origen: 'MP' }   // nueva
    ];
    const r = dedupIncomingTransactions(incoming, existing);
    assertEqual(r.keptCount, 1);
    assertEqual(r.skippedCount, 1);
    assertEqual(r.kept[0].descripcion, 'B');
  });

  test('dedupIncomingTransactions: multiplicidad — 2 existen, 3 entrantes → solo 1 se agrega', function () {
    // Dos cafés iguales el mismo día ya estaban cargados; el archivo trae 3
    const tx = { fecha: '01/04/2026', descripcion: 'Café', monto: 5000, origen: 'MP' };
    const existing = [tx, tx];
    const incoming = [tx, tx, tx];
    const r = dedupIncomingTransactions(incoming, existing);
    assertEqual(r.keptCount, 1);
    assertEqual(r.skippedCount, 2);
  });

  test('dedupIncomingTransactions: multiplicidad — 3 existen, 2 entrantes → ninguna se agrega', function () {
    const tx = { fecha: '01/04/2026', descripcion: 'Café', monto: 5000, origen: 'MP' };
    const existing = [tx, tx, tx];
    const incoming = [tx, tx];
    const r = dedupIncomingTransactions(incoming, existing);
    assertEqual(r.keptCount, 0);
    assertEqual(r.skippedCount, 2);
  });

  test('dedupIncomingTransactions: orígenes distintos NO se consideran duplicados', function () {
    const existing = [{ fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' }];
    const incoming = [{ fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'Galicia' }];
    const r = dedupIncomingTransactions(incoming, existing);
    assertEqual(r.keptCount, 1);
    assertEqual(r.skippedCount, 0);
  });

  test('dedupIncomingTransactions: escenario carga parcial → carga completa', function () {
    // Lunes 1: cargo MP del 1-7 abril (3 tx). Lunes 8: cargo del 1-14 abril (5 tx que incluyen las 3 anteriores)
    const semana1 = [
      { fecha: '01/04/2026', descripcion: 'A', monto: 100, origen: 'MP' },
      { fecha: '03/04/2026', descripcion: 'B', monto: 200, origen: 'MP' },
      { fecha: '05/04/2026', descripcion: 'C', monto: 300, origen: 'MP' }
    ];
    const semana12Combined = semana1.concat([
      { fecha: '08/04/2026', descripcion: 'D', monto: 400, origen: 'MP' },
      { fecha: '10/04/2026', descripcion: 'E', monto: 500, origen: 'MP' }
    ]);
    const r = dedupIncomingTransactions(semana12Combined, semana1);
    assertEqual(r.keptCount, 2);
    assertEqual(r.skippedCount, 3);
    assertEqual(r.kept[0].descripcion, 'D');
    assertEqual(r.kept[1].descripcion, 'E');
  });

  test('dedupIncomingTransactions: input vacío o no-array no rompe', function () {
    assertEqual(dedupIncomingTransactions([], []).keptCount, 0);
    assertEqual(dedupIncomingTransactions(null, []).keptCount, 0);
    assertEqual(dedupIncomingTransactions(undefined, [{}]).keptCount, 0);
  });
});

group('Export / Import de configuración', function () {
  test('serializeRules / deserializeRules — replace_all', function () {
    const rules = [{ pattern: 'uber', cat: 'Transporte' }, { pattern: 'starbucks', cat: 'Gastronomia' }];
    const blob = serializeRules(rules);
    assertEqual(blob.type, 'rules');
    assertEqual(blob.data.rules.length, 2);
    // replace_all sobre 3 existentes → quedan solo las 2 del archivo
    const existing = [{ pattern: 'old1', cat: 'X' }, { pattern: 'old2', cat: 'Y' }, { pattern: 'old3', cat: 'Z' }];
    const result = deserializeRules(blob, existing, 'replace_all');
    assertEqual(result.length, 2);
    assertEqual(result[0].pattern, 'uber');
  });

  test('deserializeRules — replace_byid sobreescribe coincidentes y agrega nuevas', function () {
    const blob = serializeRules([
      { pattern: 'uber', cat: 'NUEVO_VALOR' },
      { pattern: 'nueva_regla', cat: 'X' }
    ]);
    const existing = [
      { pattern: 'uber', cat: 'VIEJO' },
      { pattern: 'otra', cat: 'Y' }
    ];
    const result = deserializeRules(blob, existing, 'replace_byid');
    assertEqual(result.length, 3);
    const uberRule = result.find(function (r) { return r.pattern === 'uber'; });
    assertEqual(uberRule.cat, 'NUEVO_VALOR');
    const otraRule = result.find(function (r) { return r.pattern === 'otra'; });
    assertEqual(otraRule.cat, 'Y');  // sin cambios
  });

  test('deserializeRules — merge_new NO sobreescribe lo existente', function () {
    const blob = serializeRules([
      { pattern: 'uber', cat: 'NUEVO_VALOR' },   // ya existe, NO debe pisar
      { pattern: 'nueva', cat: 'X' }              // nueva, debe agregar
    ]);
    const existing = [
      { pattern: 'uber', cat: 'VIEJO_PROTEGIDO' }
    ];
    const result = deserializeRules(blob, existing, 'merge_new');
    assertEqual(result.length, 2);
    const uberRule = result.find(function (r) { return r.pattern === 'uber'; });
    assertEqual(uberRule.cat, 'VIEJO_PROTEGIDO');
  });

  test('serializeCategories / deserializeCategories — replace_all incluye los 5 dicts', function () {
    const stateLike = {
      categoryLabels: { A: 'A', B: 'B' },
      categoryColors: { A: '#fff' },
      categoryClassification: { A: 'basic' },
      subcategoryLabels: { A: { a1: 'sub1' } },
      subcategoryClassification: { A: { a1: 'basic' } }
    };
    const blob = serializeCategories(stateLike);
    assertEqual(blob.type, 'categories');
    const existing = { categoryLabels: { X: 'X' }, categoryColors: {}, categoryClassification: {}, subcategoryLabels: {}, subcategoryClassification: {} };
    const result = deserializeCategories(blob, existing, 'replace_all');
    assertEqual(Object.keys(result.categoryLabels).length, 2);  // solo A, B (no X)
    assert(result.categoryLabels.A === 'A');
    assert(result.subcategoryLabels.A.a1 === 'sub1');
  });

  test('deserializeCategories — replace_byid sobreescribe label pero conserva categorías no enviadas', function () {
    const blob = serializeCategories({
      categoryLabels: { Vivienda: 'Vivienda Nuevo Label' },
      categoryColors: {},
      categoryClassification: { Vivienda: 'basic' },
      subcategoryLabels: {},
      subcategoryClassification: {}
    });
    const existing = {
      categoryLabels: { Vivienda: 'Vivienda Viejo', Salud: 'Salud' },
      categoryColors: {}, categoryClassification: { Vivienda: 'discretionary', Salud: 'basic' },
      subcategoryLabels: {}, subcategoryClassification: {}
    };
    const result = deserializeCategories(blob, existing, 'replace_byid');
    assertEqual(result.categoryLabels.Vivienda, 'Vivienda Nuevo Label');
    assertEqual(result.categoryLabels.Salud, 'Salud');  // conservada
    assertEqual(result.categoryClassification.Vivienda, 'basic');  // sobrescrita
    assertEqual(result.categoryClassification.Salud, 'basic');     // conservada
  });

  test('deserializeCategories — merge_new conserva todas las existentes y solo agrega nuevas', function () {
    const blob = serializeCategories({
      categoryLabels: { Vivienda: 'NUEVO_LABEL', Nueva: 'Nueva Cat' },
      categoryColors: {}, categoryClassification: {},
      subcategoryLabels: { Vivienda: { sub1: 'NUEVO_SUB' }, Nueva: { sN: 'subN' } },
      subcategoryClassification: {}
    });
    const existing = {
      categoryLabels: { Vivienda: 'OLD' },
      categoryColors: {}, categoryClassification: {},
      subcategoryLabels: { Vivienda: { sub1: 'OLD_SUB' } },
      subcategoryClassification: {}
    };
    const result = deserializeCategories(blob, existing, 'merge_new');
    assertEqual(result.categoryLabels.Vivienda, 'OLD');           // conservada
    assertEqual(result.categoryLabels.Nueva, 'Nueva Cat');        // agregada
    assertEqual(result.subcategoryLabels.Vivienda.sub1, 'OLD_SUB');  // conservada
    assertEqual(result.subcategoryLabels.Nueva.sN, 'subN');          // agregada
  });

  test('serializeTags / deserializeTags — los 3 modos', function () {
    const blob = serializeTags({ JALM: { label: 'JALM', color: '#888' }, NUEVO: { label: 'Nuevo' } });
    const existing = { JALM: { label: 'JALM OLD', color: '#000' }, CLM: { label: 'CLM' } };
    // replace_all
    const r1 = deserializeTags(blob, existing, 'replace_all');
    assertEqual(Object.keys(r1).length, 2);
    assert(!r1.CLM);  // borrada
    // replace_byid
    const r2 = deserializeTags(blob, existing, 'replace_byid');
    assertEqual(Object.keys(r2).length, 3);
    assertEqual(r2.JALM.label, 'JALM');     // sobrescrita
    assertEqual(r2.CLM.label, 'CLM');       // conservada
    assertEqual(r2.NUEVO.label, 'Nuevo');   // agregada
    // merge_new
    const r3 = deserializeTags(blob, existing, 'merge_new');
    assertEqual(Object.keys(r3).length, 3);
    assertEqual(r3.JALM.label, 'JALM OLD');  // conservada (NO sobrescrita)
    assertEqual(r3.CLM.label, 'CLM');         // conservada
    assertEqual(r3.NUEVO.label, 'Nuevo');    // agregada
  });

  test('serializeFullConfig — solo incluye secciones marcadas', function () {
    const stateLike = {
      categoryRules: [{ pattern: 'x', cat: 'A' }],
      categoryLabels: { A: 'A' },
      categoryColors: {}, categoryClassification: {},
      subcategoryLabels: {}, subcategoryClassification: {},
      tags: { JALM: { label: 'JALM' } }
    };
    const blob = serializeFullConfig(stateLike, { rules: true, categories: false, tags: true });
    assertEqual(blob.type, 'full');
    assert(blob.sections.rules === true);
    assert(blob.sections.categories === undefined);
    assert(blob.sections.tags === true);
    assert(blob.data.rules.length === 1);
    assert(blob.data.categories === undefined);
    assert(blob.data.tags.JALM);
  });

  test('previewImport — devuelve current/incoming/willHave por sección', function () {
    const blob = serializeRules([{ pattern: 'a' }, { pattern: 'b' }, { pattern: 'c' }]);
    const existing = { categoryRules: [{ pattern: 'a' }, { pattern: 'old' }] };
    const p1 = previewImport(blob, existing, 'replace_all');
    assertEqual(p1.rules.current, 2);
    assertEqual(p1.rules.incoming, 3);
    assertEqual(p1.rules.willHave, 3);
    const p2 = previewImport(blob, existing, 'replace_byid');
    assertEqual(p2.rules.willHave, 4);  // a (sobre), b, c (nuevas), old (conservada)
    const p3 = previewImport(blob, existing, 'merge_new');
    assertEqual(p3.rules.willHave, 4);  // a (conservada), b, c (nuevas), old (conservada)
  });

  test('deserialize* — rechaza tipo incorrecto', function () {
    let threw = false;
    try {
      deserializeRules({ type: 'tags', data: {} }, [], 'replace_all');
    } catch (e) { threw = true; }
    assert(threw, 'debió lanzar error al recibir type incorrecto');
  });

  test('deserialize* — rechaza modo inválido', function () {
    let threw = false;
    try {
      deserializeRules(serializeRules([]), [], 'modo_invalido');
    } catch (e) { threw = true; }
    assert(threw);
  });
});

group('computeHealthScore — score de salud financiera', function () {
  test('caso ideal: score alto, label Saludable', function () {
    // Con el nuevo componente "Reservas (meses de vida)" peso 25:
    // necesitamos reservaAcumulada ~ 6+ meses de gastos para perfect score.
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 600000, gastosDiscrecionales: 100000,
      inversion: 200000, prestamos: 0,
      reservaAcumulada: 3600000, nMeses: 1
    });
    assert(r.hasData);
    assert(r.score >= 90, 'score esperado >= 90, got ' + r.score);
    assertEqual(r.label, 'Saludable');
    assertEqual(r.color, '#6B8E4E');
    assertEqual(r.components.length, 5);
  });
  test('caso regular: score medio, label Atención', function () {
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 850000, gastosDiscrecionales: 350000,
      inversion: 50000, prestamos: 0,
      reservaAcumulada: 2500000, nMeses: 1
    });
    assert(r.score >= 50 && r.score < 75, 'score esperado 50-74, got ' + r.score);
    assertEqual(r.label, 'Atención');
  });
  test('caso crítico: score bajo, label Crítico', function () {
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 1200000, gastosDiscrecionales: 700000,
      inversion: 0, prestamos: 500000
    });
    assert(r.score < 50, 'score esperado < 50, got ' + r.score);
    assertEqual(r.label, 'Crítico');
    assertEqual(r.color, '#C8553D');
  });
  test('sin sueldo pero con gastos: calcula con componentes alternativos', function () {
    const r = computeHealthScore({
      sueldo: 0, gastosTotal: 500000, gastosDiscrecionales: 100000,
      inversion: 80000, prestamos: 0,
      reservaAcumulada: 0, nMeses: 1
    });
    assertEqual(r.hasData, true);
    assert(r.score > 0, 'sin sueldo pero con gastos debe dar score positivo, got ' + r.score);
    // Activos: discrecional, ahorro-alt, deuda-alt, reservas (4). Skipped: margen.
    assertEqual(r.activeCount, 4);
    assertEqual(r.skippedCount, 1);
    // Validar que las maxPoints de los activos sumen 100 (redistribución)
    const activeMax = r.components.filter(function (c) { return !c.skipped; })
      .reduce(function (a, c) { return a + c.maxPoints; }, 0);
    assertEqual(activeMax, 100);
    // El margen aparece como skipped
    const margen = r.components.find(function (c) { return c.name === 'Margen libre'; });
    assert(margen && margen.skipped === true, 'margen debe estar skipped sin sueldo');
  });
  test('sin sueldo ni gastos: hasData=false', function () {
    const r = computeHealthScore({ sueldo: 0, gastosTotal: 0 });
    assertEqual(r.hasData, false);
    assertEqual(r.label, 'Sin datos');
    assertEqual(r.score, 0);
  });
  test('config custom: pesos editables', function () {
    // Input intermedio (no llega a 100 ni queda en 0): cambiar pesos cambia el score.
    const ctx = {
      sueldo: 1000000, gastosTotal: 700000, gastosDiscrecionales: 200000,
      inversion: 80000, prestamos: 50000
    };
    const rDefault = computeHealthScore(ctx);
    // Bajamos el peso de discrecional a 5 y subimos margen a 65 → score baja
    // porque "discrecional bueno" ya no aporta tanto y "margen apenas pasable"
    // ahora pesa más en relación.
    const rCustom = computeHealthScore(ctx, {
      discWeight: 5, margenWeight: 65
    });
    assert(rDefault.score !== rCustom.score, 'scores deberían diferir con pesos distintos. default=' + rDefault.score + ' custom=' + rCustom.score);
  });
  test('umbrales custom: cambian la clasificación', function () {
    const ctx = { sueldo: 1000000, gastosTotal: 600000, gastosDiscrecionales: 200000, inversion: 50000, prestamos: 0 };
    // Con umbrales por defecto: discrecional 33% → cae en "bueno" (entre 25 y 35)
    const r1 = computeHealthScore(ctx);
    // Con umbrales más exigentes para discrecional: 33% > 20 (excelente) → "regular"
    const r2 = computeHealthScore(ctx, { discThresholds: { excelente: 10, bueno: 20, regular: 30 } });
    // El segundo debería dar score menor (más exigente)
    assert(r2.score <= r1.score, 'umbrales más exigentes → score menor o igual');
  });
  test('componentes tienen displayValue formateado', function () {
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 500000, gastosDiscrecionales: 100000,
      inversion: 100000, prestamos: 0,
      reservaAcumulada: 1500000, nMeses: 1
    });
    r.components.forEach(function (c) {
      // El componente "Reservas (meses de vida)" usa sufijo "meses" en vez de "%"
      const hasPct = c.displayValue.indexOf('%') >= 0;
      const hasMeses = c.displayValue.indexOf('meses') >= 0;
      const isDash = c.displayValue === '—';
      assert(hasPct || hasMeses || isDash, c.name + ': displayValue debe tener "%" o "meses" — got "' + c.displayValue + '"');
      assert(typeof c.points === 'number');
      assert(typeof c.maxPoints === 'number');
      assert(c.points <= c.maxPoints, c.name + ': points debe ser <= maxPoints');
    });
  });
  test('Deuda nueva 0% (sin préstamos) puntúa máximo (regresión: comparación <= vs <)', function () {
    // Con sueldo presente y prestamos=0, Deuda nueva debe estar en tier
    // "excelente" → 20/20 pts (no 15/20 como daba el bug donde 0 < 0 es false).
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 500000, gastosDiscrecionales: 100000,
      inversion: 0, prestamos: 0,
      reservaAcumulada: 0, nMeses: 1
    });
    const deuda = r.components.find(function (c) { return c.name === 'Deuda nueva'; });
    assert(deuda, 'componente Deuda nueva debe existir');
    assertEqual(deuda.points, 20);
    assertEqual(deuda.maxPoints, 20);
    assertEqual(deuda.displayValue, '0.0%');
  });
  test('config parcial del usuario hace deep merge (regresión: shallow merge perdía thresholds)', function () {
    // Bug: el usuario sobreescribe SOLO el peso de margen pero NO los thresholds.
    // Con shallow merge, margenThresholds quedaría {} y el componente puntuaría
    // 0 aunque el valor sea excelente.
    // Con deep merge, los thresholds faltantes se completan con los defaults.
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 500000, gastosDiscrecionales: 100000,
      inversion: 0, prestamos: 0,
      reservaAcumulada: 0, nMeses: 1
    }, {
      margenWeight: 25  // peso custom pero SIN thresholds
      // (no incluyo margenThresholds — deberían venir del default: excelente=30)
    });
    const margen = r.components.find(function (c) { return c.name === 'Margen libre'; });
    assert(margen, 'componente Margen libre debe existir');
    // sueldo=1M, gastos=500k → margen = 50% que es >= 30 (excelente).
    // Lo importante es que puntúe LO MÁXIMO posible (points == maxPoints).
    // El valor exacto depende del scaleFactor que aplica la redistribución.
    assertEqual(margen.points, margen.maxPoints);
    assert(margen.points > 0, 'margen debe puntuar > 0 con valor excelente, got ' + margen.points);
  });
  test('config con override parcial de thresholds: completa con defaults', function () {
    // El usuario sobreescribe solo "excelente" — "bueno" y "regular" deben
    // venir del default.
    const r = computeHealthScore({
      sueldo: 1000000, gastosTotal: 800000, gastosDiscrecionales: 100000,
      inversion: 0, prestamos: 0,
      reservaAcumulada: 0, nMeses: 1
    }, {
      margenThresholds: { excelente: 50 }  // solo excelente custom
      // bueno (15) y regular (5) deben venir del default
    });
    const margen = r.components.find(function (c) { return c.name === 'Margen libre'; });
    // margen = (1M - 800k) / 1M = 20% → entre default bueno (15) y default
    // regular (5) — no llega a custom excelente (50) ni al default bueno (15)
    // ... espera, 20 >= 15 (bueno) → debe puntuar weight * 0.7 = 21
    assert(margen.points > 0, 'margen 20% debe puntuar > 0 con thresholds completos via deep merge');
  });
});

      { id: 'k1', label: 'Sueldos', enabled: true, order: 1, op: { type: 'tx_sum', categoria: 'Sueldo' }, accent: '#6B8E4E' },
      { id: 'k2', label: 'Gastos totales', enabled: true, order: 2, op: { type: 'gasto_total' }, accent: '#C8553D' },
      { id: 'k3', label: 'Vivienda', enabled: true, order: 3, op: { type: 'tx_sum', categoria: 'Vivienda' }, accent: '#8B4A3F' },
      { id: 'k4', label: 'Discrecionales JALM', enabled: true, order: 4, op: { type: 'tx_sum', classFilter: 'discretionary', tags: ['JALM'] }, accent: '#D4A24C' },
      { id: 'k5', label: 'Solo CLM', enabled: false, order: 5, op: { type: 'tx_sum', tags: ['CLM'] }, accent: '#D4849E' }
    ]
  };
  return state;
}

group('INTEGRACIÓN — Trimestre completo Q1 2026', function () {
  function withState(fn) {
    const prev = globalThis.state;
    globalThis.state = buildRealisticState();
    try { return fn(); } finally { globalThis.state = prev; }
  }

  test('KPI Sueldos: suma todos los sueldos del Q1', function () {
    withState(function () {
      const v = computeKpiOp({ type: 'tx_sum', categoria: 'Sueldo' }, { activeMonths: ['enero','febrero','marzo'] });
      // 800k + 850k + 900k = 2.550.000
      assertEqual(v, 2550000);
    });
  });

  test('KPI Vivienda mes a mes: sparkline-friendly (un mes por vez)', function () {
    withState(function () {
      const op = { type: 'tx_sum', categoria: 'Vivienda' };
      // Enero: 250k + 45k = 295k
      assertEqual(computeKpiOp(op, { activeMonths: ['enero'] }), 295000);
      // Febrero: 250k
      assertEqual(computeKpiOp(op, { activeMonths: ['febrero'] }), 250000);
      // Marzo: 250k
      assertEqual(computeKpiOp(op, { activeMonths: ['marzo'] }), 250000);
    });
  });

  test('KPI classFilter "discretionary" excluye flujo Y respeta override de sub', function () {
    withState(function () {
      const v = computeKpiOp({ type: 'tx_sum', classFilter: 'discretionary' }, { activeMonths: ['enero'] });
      // Discrecionales en enero:
      //   - Gastronomia 35k (discrecional puro)
      //   - Educacion·Cursos 25k (override: cursos es discrecional aunque educación es básica)
      //   - Entretenimiento 40k
      // Total = 100k
      assertEqual(v, 100000);
    });
  });

  test('KPI classFilter + tags: combina con AND', function () {
    withState(function () {
      const v = computeKpiOp({ type: 'tx_sum', classFilter: 'discretionary', tags: ['JALM'] }, { activeMonths: ['enero'] });
      // Discrecionales con tag JALM en enero:
      //   - Gastronomia 35k (JALM)
      //   - Educacion·Cursos 25k (JALM)
      //   - Entretenimiento 40k (JALM)
      // Total = 100k (todas casualmente tienen JALM, pero el filtro es estricto)
      assertEqual(v, 100000);
    });
  });

  test('KPI con tag CLM aislado: cuenta tx con CLM (incluso de flujo si no hay filtro de clasificación)', function () {
    withState(function () {
      // tags sin classFilter → cualquier tx con tag CLM cuenta (incluso si es flujo)
      const v = computeKpiOp({ type: 'tx_sum', tags: ['CLM'] }, { activeMonths: ['enero','febrero','marzo'] });
      // CLM en Q1:
      //   - Enero Educacion·Colegio 60k (CLM)
      //   - Febrero Educacion·Colegio 60k (CLM)
      //   - Marzo Vacaciones 200k (JALM, CLM)
      assertEqual(v, 320000);
    });
  });

  test('Score de salud financiera: Q1 con ratios típicos da Atención o Saludable', function () {
    withState(function () {
      // Calcular agregados Q1
      let sueldo = 0, gastos = 0, gastosDisc = 0, inversion = 0;
      const all = state.transactionsByYear[2026];
      ['enero','febrero','marzo'].forEach(function (m) {
        all[m].forEach(function (t) {
          if (t.categoria === 'Sueldo') sueldo += t.monto;
          else if (t.categoria === 'Inversion') inversion += t.monto;
          else if (!isNonExpenseCat(t.categoria)) {
            gastos += t.monto;
            // Clasificación efectiva con override de sub
            const cls = (t.subcategoria && state.subcategoryClassification[t.categoria] && state.subcategoryClassification[t.categoria][t.subcategoria])
              || getCategoryClassification(t.categoria);
            if (cls === 'discretionary') gastosDisc += t.monto;
          }
        });
      });
      const r = computeHealthScore({
        sueldo: sueldo, gastosTotal: gastos, gastosDiscrecionales: gastosDisc,
        inversion: inversion, prestamos: 0
      });
      assert(r.hasData, 'score debería tener datos con sueldo > 0');
      assert(r.score > 0 && r.score <= 100, 'score en rango 0-100, got ' + r.score);
      // Documentar el ratio para futuras regresiones
      const pctDisc = (gastosDisc / gastos * 100);
      assert(pctDisc > 0 && pctDisc < 100, 'ratio discrecional debe ser % válido, got ' + pctDisc);
    });
  });

  test('Score reacciona a cambios de clasificación de subcategoría', function () {
    withState(function () {
      // Estado A: con Cursos como discrecional (override)
      const ingA = computeKpiOp({ type: 'tx_sum', classFilter: 'basic' }, { activeMonths: ['enero'] });
      const discA = computeKpiOp({ type: 'tx_sum', classFilter: 'discretionary' }, { activeMonths: ['enero'] });
      // Quito el override → Cursos vuelve a ser básica (hereda de Educación)
      state.subcategoryClassification.Educacion = {};
      const ingB = computeKpiOp({ type: 'tx_sum', classFilter: 'basic' }, { activeMonths: ['enero'] });
      const discB = computeKpiOp({ type: 'tx_sum', classFilter: 'discretionary' }, { activeMonths: ['enero'] });
      // En B, los 25k de Cursos cambiaron de discrecional a básica
      assertEqual(ingB - ingA, 25000);
      assertEqual(discA - discB, 25000);
    });
  });

  test('Reglas de categorización: matchea descripción y devuelve la categoría correcta', function () {
    withState(function () {
      const r1 = matchCategoryRule('CARREFOUR SAN ISIDRO', state.categoryRules[0]);
      assert(r1 && r1.categoria === 'Supermercado');
      const r2 = matchCategoryRule('Coto Express 123', state.categoryRules[0]);
      assert(r2 && r2.categoria === 'Supermercado');
      const r3 = matchCategoryRule('Spotify Premium', state.categoryRules[0]);
      assertEqual(r3, null);
    });
  });

  test('Coherencia: suma mensual = suma trimestral (KPI gasto_total)', function () {
    withState(function () {
      // Calcular Q1 sumando por mes
      let porMes = 0;
      ['enero','febrero','marzo'].forEach(function (m) {
        const txs = state.transactionsByYear[2026][m];
        txs.forEach(function (t) {
          if (t.categoria && !isNonExpenseCat(t.categoria)) porMes += t.monto;
        });
      });
      // Q1 directo
      const txsQ1 = []
        .concat(state.transactionsByYear[2026].enero)
        .concat(state.transactionsByYear[2026].febrero)
        .concat(state.transactionsByYear[2026].marzo);
      let directo = 0;
      txsQ1.forEach(function (t) {
        if (t.categoria && !isNonExpenseCat(t.categoria)) directo += t.monto;
      });
      assertEqual(porMes, directo);
    });
  });

  test('KPIs deshabilitadas no rompen el render (filter funciona)', function () {
    withState(function () {
      const enabled = state.kpiCardsConfig.filter(function (c) { return c.enabled !== false; });
      const disabled = state.kpiCardsConfig.filter(function (c) { return c.enabled === false; });
      assertEqual(enabled.length, 4);
      assertEqual(disabled.length, 1);
      // Computar todas las habilitadas no tira
      enabled.forEach(function (k) {
        const v = computeKpiOp(k.op, { activeMonths: ['enero','febrero','marzo'], total: 1645000 });
        assert(typeof v === 'number' && isFinite(v), 'KPI ' + k.label + ' debe devolver número finito');
      });
    });
  });
});

      transactionsByYear: { 2026: {

      }}
    });

  test('score con sueldo 0 pero con gastos: calcula con componentes alt', function () {
    const r = computeHealthScore({ sueldo: 0, gastosTotal: 100000, gastosDiscrecionales: 50000 });
    assertEqual(r.hasData, true);
    assert(r.activeCount >= 2, 'al menos discrecional y un alt deben estar activos');
  });
  test('score sin nada (0 sueldo, 0 gastos): hasData=false', function () {
    const r = computeHealthScore({ sueldo: 0, gastosTotal: 0, gastosDiscrecionales: 0 });
    assertEqual(r.hasData, false);
  });
  test('score con gastos 0 pero sueldo positivo: no divide por cero, score razonable', function () {
    const r = computeHealthScore({ sueldo: 1000000, gastosTotal: 0, gastosDiscrecionales: 0, inversion: 0, prestamos: 0 });
    assert(r.hasData);
    // Sin gastos, el componente 1 (discrecional/total) se omite y se redistribuyen
    // los pesos entre los 3 activos. Con sueldo solo: margen 100% (pleno), ahorro 0%,
    // deuda 0% (pleno). Score esperado >= 60.
    assert(r.score >= 60, 'score con gastos 0 esperado >= 60, got ' + r.score);
    assertEqual(r.activeCount, 3); // omite discrecional
  });
});

// RENDER DE RESULTADOS
// ============================================================

function renderResults() {
  const resultsEl = document.getElementById('results');
  const summaryEl = document.getElementById('summary');
  let totalTests = 0, totalOk = 0, totalFail = 0, totalTime = 0;
  let html = '';
  allGroups.forEach(function (g) {
    const groupOk = g.tests.filter(function (t) { return t.ok; }).length;
    const groupTotal = g.tests.length;
    const groupAllOk = groupOk === groupTotal;
    totalTests += groupTotal;
    totalOk += groupOk;
    totalFail += (groupTotal - groupOk);
    html += '<div class="group">' +
      '<div class="group-title">' + escapeHtmlSafe(g.name) + '</div>' +
      '<div class="group-meta">' + groupOk + ' / ' + groupTotal + (groupAllOk ? ' OK' : ' — ' + (groupTotal - groupOk) + ' FALLAN') + '</div>';
    g.tests.forEach(function (t) {
      totalTime += t.timeMs;
      html += '<div class="test ' + (t.ok ? 'ok' : 'fail') + '">' +
        '<span class="test-icon">' + (t.ok ? '✓' : '✗') + '</span>' +
        '<span class="test-name">' + escapeHtmlSafe(t.name) + '</span>' +
        '<span class="test-time">' + t.timeMs + 'ms</span>' +
        (t.error ? '<div class="test-detail">' + escapeHtmlSafe(t.error) + '</div>' : '') +
      '</div>';
    });
    html += '</div>';
  });
  resultsEl.innerHTML = html;
  const allOk = totalFail === 0;
  summaryEl.innerHTML =
    '<div class="stat"><div class="stat-label">Total tests</div><div class="stat-val">' + totalTests + '</div></div>' +
    '<div class="stat"><div class="stat-label">OK</div><div class="stat-val ok">' + totalOk + '</div></div>' +
    '<div class="stat"><div class="stat-label">Fallan</div><div class="stat-val ' + (allOk ? 'ok' : 'fail') + '">' + totalFail + '</div></div>' +
    '<div class="stat"><div class="stat-label">Tiempo</div><div class="stat-val">' + Math.round(totalTime) + 'ms</div></div>' +
    '<div class="stat"><div class="stat-label">Estado</div><div class="stat-val ' + (allOk ? 'ok' : 'fail') + '">' + (allOk ? 'PASS' : 'FAIL') + '</div></div>';
  document.title = (allOk ? '✓' : '✗') + ' Tests · ' + totalOk + '/' + totalTests;
}

function runAllTests() {
  // Limpiar grupos previos si se vuelve a correr
  allGroups.length = 0;
  // Re-ejecutar todos los group() calls. Como en este archivo cada group() está
  // al top-level, en un re-run necesitaríamos volver a evaluar todo el script.
  // Solución simple: recargar la página.
  if (allGroups.length === 0) {
    window.location.reload();
    return;
  }
  renderResults();
}

// Render inicial al cargar
renderResults();
